# Project configuration. Plain YAML — see src/somali_foodsec_radio/config.py for the
# loader. A gitignored config/config.local.yaml (if present) is deep-merged on top;
# copy config.local.yaml.example to start one.
#
# Sections are added as pipeline stages are built out: `translation`, `topics`, `geo`
# and `feedback` join later.

project:
  name: somali_foodsec_radio

# Values under `paths:` are resolved to absolute paths against the repository root.
paths:
  data_raw: data/raw
  data_interim: data/interim
  transcripts: data/interim/transcripts
  translations: data/interim/translations
  data_processed: data/processed
  data_external: data/external
  logs: logs

# SoundCloud source — Radio Ergo broadcasts.
soundcloud:
  profile_url: https://soundcloud.com/radio-ergo
  broadcast_slug: idaacadda          # URL pattern: <profile>/idaacadda-DD-mon-YYYY
  audio_codec: mp3
  rate_limit_seconds: 0.3            # pause between track downloads

# Speech-to-text models (see the transcription/ package).
asr:
  wav2vec2_model: Mustafaa4a/ASR-Somali        # production Somali Wav2Vec2 ASR
  whisper_model_size: small                    # OpenAI Whisper size (asr_whisper.py)
  somali_whisper_model: steja/whisper-small-somali
  elevenlabs_model: scribe_v1                  # ElevenLabs Scribe model
  gemini_model: gemini-2.0-flash               # Gemini transcription / translation
  batch_size: 8                      # GPU inference batch size (4-16 recommended)
  use_fp16: true                     # mixed precision (L4 Tensor Cores)
  chunk_length_s: 60                 # audio chunk length, seconds
  chunk_overlap_ratio: 0.1           # fractional overlap between chunks
  target_sample_rate: 16000
  batch_size_days: 30                # date-range chunk size for crash recovery

# Output filenames written into the transcripts directory.
outputs:
  transcriptions_csv: transcriptions_database.csv
  transcription_log: .transcription_log.json

# Translation — Somali -> English (see translation/translate_hf.py).
translation:
  models:
    nllb_3_3b: facebook/nllb-200-3.3B
    madlad_3b: google/madlad400-3b-mt
    madlad_10b: google/madlad400-10b-mt
  src_lang: som_Latn
  tgt_lang: eng_Latn
  text_column: transcript_text       # column in the transcripts CSV to translate
  max_tokens: 450                    # per-chunk token budget (model limit is 512)
  overlap_sentences: 2               # sentence overlap between consecutive chunks

# Topic modelling (see topics/).
topics:
  spacy_model: en_core_web_sm        # spaCy model for location NER
  prob_threshold: 0.1                # min topic probability to assign a theme
  bertopic:
    min_topic_size: 5
    n_gram_range: [1, 2]
  theme_map:                         # BERTopic topic id -> human-readable theme
    0: Rainfall
    1: Crop Failure
    2: Livestock Health
    3: Higher Food Prices
    4: Humanitarian Aid

# IPC geometries and location matching (see geo/).
geo:
  area_col: area                     # GeoDataFrame column holding IPC area names
  fuzzy_score_cutoff: 80             # min similarity (0-100) to accept a match
  phase_colors:                      # IPC phase -> map colour
    1: "#B7E4C7"
    2: "#FFE066"
    3: "#FF9F1C"
    4: "#FF4040"
    5: "#800020"

# Retry policy for the directory batch runner (transcription/batch.py).
retry:
  count: 3
  delay_seconds: 10
