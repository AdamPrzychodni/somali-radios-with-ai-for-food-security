# Project configuration. Plain YAML — see src/somali_foodsec_radio/config.py for the
# loader, which validates this file against a schema on load. A gitignored
# config/config.local.yaml (if present) is deep-merged on top; copy
# config.local.yaml.example to start one.
#
# Every key here is read by the code. If a key stops being used, delete it — a config
# value nobody reads is worse than no config value, because tuning it looks like it
# should do something.

project:
  name: somali_foodsec_radio
  seed: 42                           # threaded into UMAP/BERTopic; without it topic
                                     # ids reshuffle and theme_map silently mislabels

# Values under `paths:` are resolved to absolute paths against the repository root.
paths:
  data_raw: data/raw
  data_interim: data/interim
  transcripts: data/interim/transcripts
  translations: data/interim/translations
  data_processed: data/processed
  data_external: data/external
  logs: logs

# SoundCloud source — Radio Ergo broadcasts.
soundcloud:
  profile_url: https://soundcloud.com/radio-ergo
  broadcast_slug: idaacadda          # URL pattern: <profile>/idaacadda-DD-mon-YYYY
  audio_codec: mp3
  rate_limit_seconds: 0.3            # pause between track downloads

# Speech-to-text models (see the transcription/ package).
asr:
  wav2vec2_model: Mustafaa4a/ASR-Somali        # production Somali Wav2Vec2 ASR
  whisper_model_size: small                    # OpenAI Whisper size (asr_whisper.py)
  somali_whisper_model: steja/whisper-small-somali
  elevenlabs_model: scribe_v1                  # ElevenLabs Scribe model
  gemini_model: gemini-2.0-flash               # Gemini transcription / translation
  batch_size: 8                      # GPU inference batch size (4-16 recommended)
  use_fp16: true                     # mixed precision (L4 Tensor Cores)
  chunk_length_s: 60                 # audio chunk length, seconds
  chunk_overlap_ratio: 0.1           # fractional overlap between chunks
  target_sample_rate: 16000
  batch_size_days: 30                # date-range chunk size for crash recovery

# Output filenames written into the transcripts directory.
outputs:
  transcriptions_csv: transcriptions_database.csv
  transcription_log: .transcription_log.json

# Translation — Somali -> English (see translation/translate_hf.py).
translation:
  models:
    nllb_3_3b: facebook/nllb-200-3.3B
    madlad_3b: google/madlad400-3b-mt
    madlad_10b: google/madlad400-10b-mt
  src_lang: som_Latn
  tgt_lang: eng_Latn
  text_column: transcript_text       # column in the transcripts CSV to translate
  max_tokens: 450                    # per-chunk token budget (model limit is 512)
  overlap_sentences: 2               # sentence overlap between consecutive chunks

# Topic modelling (see topics/).
topics:
  spacy_model: en_core_web_sm        # spaCy model for location NER
  prob_threshold: 0.1                # min topic probability to assign a theme
  bertopic:
    min_topic_size: 5
    n_gram_range: [1, 2]
  theme_map:                         # BERTopic topic id -> human-readable theme
    0: Rainfall
    1: Crop Failure
    2: Livestock Health
    3: Higher Food Prices
    4: Humanitarian Aid
  theme_keywords:                    # words each theme's topic must still contain.
                                     # verify_theme_map() raises when a fitted topic no
                                     # longer overlaps these, so drift fails loudly.
    Rainfall: [rain, rains, rainfall, wet, water, season]
    Crop Failure: [crop, crops, harvest, farm, farming, yield, failure]
    Livestock Health: [livestock, goats, cattle, camel, animals, herd]
    Higher Food Prices: [price, prices, market, cost, food, expensive]
    Humanitarian Aid: [aid, humanitarian, assistance, relief, agency, help]

# IPC geometries and location matching (see geo/).
geo:
  area_col: area                     # GeoDataFrame column holding IPC area names
  fuzzy_score_cutoff: 80             # min similarity (0-100) to accept a match
  phase_colors:                      # IPC phase -> map colour
    1: "#B7E4C7"
    2: "#FFE066"
    3: "#FF9F1C"
    4: "#FF4040"
    5: "#800020"

# Retry policy for the directory batch runner (transcription/batch.py).
retry:
  count: 3
  delay_seconds: 10

# Radio Ergo caller-feedback analysis (see the feedback/ package).
feedback:
  impact_signals:                    # signal name -> keywords matched in call remarks
    # A bare `dry` matched "dry season", and a bare `death`/`sick` matched human
    # casualties and human illness. Both are gone; matching is also negation-aware
    # (see `negators` below), so "no rain" no longer counts as positive rainfall.
    drought_warning: [drought, water shortage, dry spell, drying up]
    flood_risk: [flood, flooding, flooded, river, overflow]
    aid_request: [aid, help, assistance, displacement, idp]
    livestock_disease:
      [livestock, goats, cattle, camels, disease, animal disease, sick animals,
       sick livestock]
    rainfall_positive: [rain, rains, rainfall, good rain]
  negators:                          # cancel a keyword match within `negation_window`
                                     # ("no" is quoted: YAML would read it as false)
    ["no", not, without, lack, lacking, lacks, absence, absent, failed, failure,
     waiting, awaiting, need, needs, needed, shortage, insufficient, scarce,
     scarcity, never, delayed, poor, little, hardly, barely, stopped, ceased,
     missing, denied, unable, cannot, "didn't", "don't", "doesn't", "hasn't",
     "haven't", "wasn't", "weren't", "isn't", "aren't"]
  negation_window: 4                 # tokens searched either side of a keyword match.
                                     # Erring wide is deliberate: a false positive on
                                     # rainfall_positive reports an improvement during a
                                     # drought, a false negative only loses one -1.
  thresholds:                        # weekly signal count needed to shift a phase
    drought_warnings: 5
    flood_risks: 3
    aid_requests: 5
    livestock_diseases: 3
    rainfall_positives: 3
  phase_effects:                     # IPC phase delta when a threshold is crossed
    drought_warnings: 1
    flood_risks: 1
    aid_requests: 1
    livestock_diseases: 1
    rainfall_positives: -1
