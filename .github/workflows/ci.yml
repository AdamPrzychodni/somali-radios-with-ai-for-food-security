name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Core + dev only. The [asr]/[analysis] extras pull torch and geopandas; the
      # test suite is pure logic and does not need them.
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Import stays cheap
        run: uv run python -c "import somali_foodsec_radio"

      - name: CLI is reachable
        run: uv run radio-collect --help
